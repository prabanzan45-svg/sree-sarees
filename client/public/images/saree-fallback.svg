<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A151C" />
      <stop offset="50%" stop-color="#722F37" />
      <stop offset="100%" stop-color="#2D0D11" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="35%" stop-color="#C5A059" />
      <stop offset="70%" stop-color="#E6C875" />
      <stop offset="100%" stop-color="#99732A" />
    </linearGradient>
    <pattern id="zariMotif" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20,5 L35,20 L20,35 L5,20 Z" fill="none" stroke="#C5A059" stroke-width="1.2" opacity="0.4" />
      <circle cx="20" cy="20" r="3" fill="#C5A059" opacity="0.5" />
    </pattern>
  </defs>

  <!-- Background Texture -->
  <rect width="600" height="800" fill="url(#maroonGrad)" />
  <rect width="600" height="800" fill="url(#zariMotif)" />

  <!-- Outer Traditional Zari Border -->
  <rect x="24" y="24" width="552" height="752" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
  <rect x="36" y="36" width="528" height="728" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8" />

  <!-- Decorative Corner Motifs (Temple & Mango) -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <path d="M42,42 L72,42 L42,72 Z" />
    <path d="M558,42 L528,42 L558,72 Z" />
    <path d="M42,758 L72,758 L42,728 Z" />
    <path d="M558,758 L528,758 L558,728 Z" />
  </g>

  <!-- Central Folded Saree Illustration -->
  <g transform="translate(100, 180)">
    <!-- Base Draped Silk Layers -->
    <path d="M20,240 Q200,280 380,240 L370,140 Q200,180 30,140 Z" fill="#5C1F27" opacity="0.9" />
    
    <!-- Top Folded Saree Body -->
    <rect x="30" y="40" width="340" height="200" rx="12" fill="#80333D" stroke="#99732A" stroke-width="1.5" />
    
    <!-- Gold Zari Pallu Border Across Fold -->
    <rect x="30" y="40" width="340" height="44" rx="8" fill="url(#goldGrad)" />
    <!-- Pallu Diamond Weave Patterns -->
    <line x1="30" y1="62" x2="370" y2="62" stroke="#4A151C" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="70" cy="62" r="5" fill="#4A151C" />
    <circle cx="120" cy="62" r="5" fill="#4A151C" />
    <circle cx="170" cy="62" r="5" fill="#4A151C" />
    <circle cx="200" cy="62" r="6" fill="#4A151C" />
    <circle cx="230" cy="62" r="5" fill="#4A151C" />
    <circle cx="280" cy="62" r="5" fill="#4A151C" />
    <circle cx="330" cy="62" r="5" fill="#4A151C" />

    <!-- Pleats / Fold Shadows -->
    <line x1="100" y1="84" x2="100" y2="240" stroke="#4A151C" stroke-width="2" opacity="0.6" />
    <line x1="170" y1="84" x2="170" y2="240" stroke="#4A151C" stroke-width="2" opacity="0.6" />
    <line x1="240" y1="84" x2="240" y2="240" stroke="#4A151C" stroke-width="2" opacity="0.6" />
    <line x1="310" y1="84" x2="310" y2="240" stroke="#4A151C" stroke-width="2" opacity="0.6" />

    <!-- Bottom Zari Border -->
    <rect x="30" y="210" width="340" height="30" rx="4" fill="url(#goldGrad)" opacity="0.95" />
  </g>

  <!-- Typography & Brand Shield -->
  <g text-anchor="middle">
    <!-- Emblem -->
    <circle cx="300" cy="510" r="28" fill="#4A151C" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="300" y="518" font-family="serif" font-size="22" font-weight="bold" fill="#F3E5AB">SS</text>

    <!-- Brand Name -->
    <text x="300" y="570" font-family="serif" font-size="34" font-weight="bold" letter-spacing="3" fill="#F3E5AB">
      SREE SAREES
    </text>

    <!-- Tagline -->
    <text x="300" y="605" font-family="serif" font-style="italic" font-size="16" letter-spacing="2" fill="#E6C875">
      Tradition Woven with Elegance.
    </text>

    <line x1="200" y1="625" x2="400" y2="625" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.6" />

    <!-- Authenticity Note -->
    <text x="300" y="655" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" opacity="0.9">
      AUTHENTIC HANDLOOM TEXTILE WEAVE
    </text>
    <text x="300" y="675" font-family="sans-serif" font-size="11" fill="#F3E5AB" opacity="0.75">
      Pure Weave • Silk Mark Guaranteed • South Masi St, Madurai
    </text>
  </g>
</svg>
